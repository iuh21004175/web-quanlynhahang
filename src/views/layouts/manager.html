<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= typeof title != 'undefined' ? title : 'Quản Lý Nhà Hàng' %></title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="/css/manager/main.css">
    <!-- Custom CSS cho từng trang -->
    <%- typeof styles != 'undefined' ? styles : '' %>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <%- include('../partials/manager/sidebar.html') %>
    </div>

    <!-- Main wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="main-header">
            <%- include('../partials/manager/header.html') %>
        </header>

        <!-- Main content -->
        <main class="main-content">
            <%- body %>
        </main>

        <!-- Footer -->
        <footer class="main-footer">
            <%- include('../partials/manager/footer.html') %>
        </footer>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main JS -->
    <script src="/js/manager/main.js"></script>
    <!-- Custom JS cho từng trang -->
    <%- typeof scripts != 'undefined' ? scripts : '' %>
</body>
</html>
