<%- include('../layouts/manager.html', {
    title: 'Quản lý khu vực',
    styles: '<link rel="stylesheet" href="/css/manager/khu-vuc.css">',
    scripts: '<script src="/js/manager/khu-vuc.js"></script>',
    body: `
    <div class="area-container">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Quản lý khu vực</h4>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addAreaModal">
                <i class="fas fa-plus me-2"></i>Thêm khu vực
            </button>
        </div>

        <!-- Bảng danh sách khu vực -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th style="width: 80px">STT</th>
                                <th>Tên khu vực</th>
                                <th>Mô tả</th>
                                <th>Trạng thái</th>
                                <th style="width: 120px">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>Tầng 1</td>
                                <td>Khu vực trong nhà, có máy lạnh</td>
                                <td>
                                    <span class="badge bg-success">Đang hoạt động</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-primary" 
                                            data-bs-toggle="modal"
                                            data-bs-target="#editAreaModal"
                                            data-bs-tooltip="tooltip"
                                            title="Chỉnh sửa">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger ms-1"
                                            data-bs-tooltip="tooltip"
                                            title="Xóa">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal thêm khu vực -->
        <div class="modal fade" id="addAreaModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Thêm khu vực mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form id="addAreaForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Tên khu vực</label>
                                <input type="text" class="form-control" name="areaName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mô tả</label>
                                <textarea class="form-control" name="description" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Trạng thái</label>
                                <select class="form-select" name="status" required>
                                    <option value="active">Đang hoạt động</option>
                                    <option value="inactive">Ngừng hoạt động</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-success">Thêm</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal chỉnh sửa khu vực -->
        <div class="modal fade" id="editAreaModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Chỉnh sửa khu vực</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form id="editAreaForm">
                        <div class="modal-body">
                            <input type="hidden" name="areaId">
                            <div class="mb-3">
                                <label class="form-label">Tên khu vực</label>
                                <input type="text" class="form-control" name="areaName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mô tả</label>
                                <textarea class="form-control" name="description" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Trạng thái</label>
                                <select class="form-select" name="status" required>
                                    <option value="active">Đang hoạt động</option>
                                    <option value="inactive">Ngừng hoạt động</option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    `
}) %>
